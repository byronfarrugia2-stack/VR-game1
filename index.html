<!doctype html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <a-box position="-1 1 -3" color="red"></a-box>

    <a-sphere position="1 1 -4" color="blue"></a-sphere>

    <!-- Grass floor -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#4CAF50">
    </a-plane>

    <!-- Blue sky -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Sun -->
    <a-sphere
      position="0 10 -20"
      radius="3"
      color="white"
      material="shader: flat">
    </a-sphere>

  </a-scene>

</body>

</html>
