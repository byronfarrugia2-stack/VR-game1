<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Containment Simulation — Rewritten & Polished</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- A‑Frame + Extras -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-event-set-component@5.0.1/dist/aframe-event-set-component.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

<style>
/* ============================================================
   BLOCK 1 — GLOBAL RESET + BASE STYLES
   ============================================================ */

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* Crosshair */
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  margin-left: -3px;
  margin-top: -3px;
  background: white;
  border-radius: 50%;
  z-index: 9999;
  pointer-events: none;
}

/* Overlay text */
.overlay {
  position: fixed;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 1.2rem;
  text-shadow: 0 0 8px #000;
  z-index: 9999;
  text-align: center;
  max-width: 80%;
  line-height: 1.4;
  display: none;
}

.overlay.show {
  display: block;
}

/* Fade overlay for contamination warnings */
#contaminationWarning {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,0,0,0.25);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 9998;
}

/* ============================================================
   BLOCK 1 — SCENE LIGHTING POLISH
   ============================================================ */

.scene-light {
  color: #ffffff;
  intensity: 1.2;
}

</style>
</head>

<body>

<div id="crosshair"></div>
<div id="contaminationWarning"></div>
<div id="overlayText" class="overlay"></div>

<!-- ============================================================
     BLOCK 1 — A‑FRAME SCENE START
     ============================================================ -->

<a-scene renderer="antialias: true; colorManagement: true;" background="color: #0a0a0a">

  <!-- Ambient + Directional Lighting -->
  <a-entity light="type: ambient; intensity: 0.55; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 0.85; color: #ffffff" position="2 4 1"></a-entity>

  <!-- Camera + Controls -->
  <a-entity id="player" position="0 1.6 4">
    <a-camera wasd-controls look-controls></a-camera>
  </a-entity>

  <!-- ============================================================
       BLOCK 1 — ROOM GEOMETRY (Walls, Floor, Ceiling)
       ============================================================ -->

  <!-- Floor -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20"
           material="color: #1a1a1a; roughness: 0.9; metalness: 0.1"></a-plane>

  <!-- Ceiling -->
  <a-plane position="0 4 0" rotation="90 0 0" width="20" height="20"
           material="color: #222; roughness: 0.8"></a-plane>

  <!-- Walls -->
  <a-plane position="0 2 -10" rotation="0 0 0" width="20" height="4"
           material="color: #2a2a2a"></a-plane>

  <a-plane position="0 2 10" rotation="0 180 0" width="20" height="4"
           material="color: #2a2a2a"></a-plane>

  <a-plane position="-10 2 0" rotation="0 90 0" width="20" height="4"
           material="color: #2a2a2a"></a-plane>

  <a-plane position="10 2 0" rotation="0 -90 0" width="20" height="4"
           material="color: #2a2a2a"></a-plane>

  <!-- ============================================================
       BLOCK 1 — PERIODIC TABLE (TOP ROW ONLY FOR NOW)
       ============================================================ -->

  <!-- Top row container -->
  <a-entity id="periodicTable" position="-6 2 -3" rotation="0 20 0">

    <!-- Top row elements (H, He, Li, Be, B, C, N, O, F, Ne) -->
    <!-- These will be highlighted in BLOCK 5 based on switch order -->

    <a-box id="pt-cell-1" position="0 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-2" position="0.6 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-3" position="1.2 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-4" position="1.8 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-5" position="2.4 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-6" position="3.0 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-7" position="3.6 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-8" position="4.2 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-9" position="4.8 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>
    <a-box id="pt-cell-10" position="5.4 0 0" depth="0.1" height="0.5" width="0.5"
           material="color:#444"></a-box>

  </a-entity>

  <!-- ============================================================
       BLOCK 1 — POWER RELAY PANEL (Switch Puzzle)
       ============================================================ -->

  <a-entity id="powerPanel" position="-5 1.5 -2" rotation="0 40 0">

    <a-box id="switch1" position="0 0 0" width="0.3" height="0.3" depth="0.1"
           material="color:#666"></a-box>

    <a-box id="switch2" position="0.5 0 0" width="0.3" height="0.3" depth="0.1"
           material="color:#666"></a-box>

    <a-box id="switch3" position="1.0 0 0" width="0.3" height="0.3" depth="0.1"
           material="color:#666"></a-box>

  </a-entity>

  <!-- ============================================================
       BLOCK 1 — CHEM AREA (Mixer + Bottles)
       ============================================================ -->

  <a-entity id="chemArea" position="4 1.2 -2" rotation="0 -40 0">

    <!-- Bottles -->
    <a-cylinder id="bottleA" position="0 0 0" height="0.4" radius="0.12"
                material="color:#a33"></a-cylinder>

    <a-cylinder id="bottleB" position="0.5 0 0" height="0.4" radius="0.12"
                material="color:#3a3"></a-cylinder>

    <a-cylinder id="bottleC" position="1.0 0 0" height="0.4" radius="0.12"
                material="color:#33a"></a-cylinder>

    <!-- Mixer -->
    <a-box id="mixer" position="0.5 0 0.6" width="0.6" height="0.4" depth="0.6"
           material="color:#888"></a-box>

  </a-entity>

  <!-- ============================================================
       BLOCK 1 — DNA MACHINE (Placeholder for now)
       ============================================================ -->

  <a-entity id="dnaMachine" position="-2 1.5 -6">
    <a-box width="1.2" height="0.8" depth="0.6" material="color:#555"></a-box>
  </a-entity>

  <!-- ============================================================
       BLOCK 1 — VENT PANEL (Placeholder for now)
       ============================================================ -->

  <a-entity id="ventPanel" position="6 1.5 -1" rotation="0 -30 0">
    <a-box width="1.2" height="0.6" depth="0.2" material="color:#555"></a-box>
  </a-entity>
  <!-- ============================================================
       BLOCK 2 — LAB DRESSING (CONSOLES, SCREENS, STORY ELEMENTS)
       ============================================================ -->

  <!-- Main status console -->
  <a-entity id="mainConsole" position="0 1.4 -4">
    <a-box width="2.4" height="1.0" depth="0.2" material="color:#333"></a-box>
    <a-text value="LAB CONTAINMENT STATUS"
            position="0 0.4 0.12"
            align="center"
            width="3"
            color="#9cf"></a-text>
    <a-text id="consoleStatusText"
            value="Power offline. Mixer idle. DNA machine locked. Vents sealed."
            position="0 0.1 0.12"
            align="center"
            width="3"
            color="#ccc"></a-text>
  </a-entity>

  <!-- Side contamination screen -->
  <a-entity id="contaminationScreen" position="-3 1.6 -3" rotation="0 20 0">
    <a-box width="1.6" height="0.9" depth="0.1" material="color:#222"></a-box>
    <a-text id="contaminationText"
            value="Contamination: Stable"
            position="0 0.2 0.08"
            align="center"
            width="2"
            color="#9f9"></a-text>
    <a-text value="Subject 07: Dormant"
            position="0 -0.1 0.08"
            align="center"
            width="2"
            color="#ccc"></a-text>
  </a-entity>

  <!-- Log terminal -->
  <a-entity id="logTerminal" position="3 1.5 -3" rotation="0 -20 0">
    <a-box width="1.4" height="0.8" depth="0.2" material="color:#222"></a-box>
    <a-text value="LAB LOG TERMINAL"
            position="0 0.25 0.12"
            align="center"
            width="2"
            color="#9cf"></a-text>
    <a-text id="logText"
            value="Log 1: Power rerouted to containment.\nLog 2: Mixer locked pending sequence.\nLog 3: DNA machine requires stable power.\nLog 4: Vents sealed until contamination drops."
            position="0 -0.05 0.12"
            align="center"
            width="2"
            color="#ccc"></a-text>
  </a-entity>

</a-scene>

<!-- ============================================================
     BLOCK 2 — CORE GAME SCRIPT (STATE, UTILS, OVERLAY)
     ============================================================ -->

<script>
/* ============================================================
   BLOCK 2 — GLOBAL STATE
   ============================================================ */

const state = {
  // Power relay
  correctPowerOrder: [],
  currentPowerSequence: [],
  powerRestored: false,

  // Mixer
  mixerActive: false,
  mixerCorrect: false,

  // DNA machine
  dnaUnlocked: false,

  // Vents
  ventsUnlocked: false,

  // Contamination
  contaminationLevel: 0, // 0 = stable, higher = worse

  // General
  gameStarted: false,
  overlayTimeout: null
};

/* ============================================================
   BLOCK 2 — UTILITY: SHOW OVERLAY TEXT
   ============================================================ */

function showOverlay(message, duration = 2500) {
  const overlay = document.getElementById('overlayText');
  overlay.textContent = message;
  overlay.classList.add('show');

  if (state.overlayTimeout) {
    clearTimeout(state.overlayTimeout);
  }

  state.overlayTimeout = setTimeout(() => {
    overlay.classList.remove('show');
  }, duration);
}

/* ============================================================
   BLOCK 2 — UTILITY: UPDATE CONTAMINATION VISUAL
   ============================================================ */

function updateContaminationVisual() {
  const warning = document.getElementById('contaminationWarning');
  const text = document.getElementById('contaminationText');

  if (state.contaminationLevel <= 0) {
    warning.style.opacity = 0;
    text.setAttribute('value', 'Contamination: Stable');
    text.setAttribute('color', '#9f9');
  } else if (state.contaminationLevel === 1) {
    warning.style.opacity = 0.2;
    text.setAttribute('value', 'Contamination: Elevated');
    text.setAttribute('color', '#ff9');
  } else {
    warning.style.opacity = 0.4;
    text.setAttribute('value', 'Contamination: Critical');
    text.setAttribute('color', '#f66');
  }
}

/* ============================================================
   BLOCK 2 — UTILITY: UPDATE MAIN CONSOLE STATUS
   ============================================================ */

function updateConsoleStatus() {
  const consoleText = document.getElementById('consoleStatusText');
  let status = [];

  if (state.powerRestored) {
    status.push('Power: ONLINE');
  } else {
    status.push('Power: OFFLINE');
  }

  if (state.mixerCorrect) {
    status.push('Mixer: STABLE');
  } else if (state.mixerActive) {
    status.push('Mixer: ACTIVE (UNSTABLE)');
  } else {
    status.push('Mixer: IDLE');
  }

  if (state.dnaUnlocked) {
    status.push('DNA Machine: UNLOCKED');
  } else {
    status.push('DNA Machine: LOCKED');
  }

  if (state.ventsUnlocked) {
    status.push('Vents: OPEN');
  } else {
    status.push('Vents: SEALED');
  }

  consoleText.setAttribute('value', status.join(' | '));
}

/* ============================================================
   BLOCK 2 — RANDOMIZE POWER ORDER + PERIODIC TABLE CLUE
   ============================================================ */

function randomizePowerOrder() {
  const base = ['1', '2', '3'];
  // Simple shuffle
  state.correctPowerOrder = base
    .map(v => ({ v, sort: Math.random() }))
    .sort((a, b) => a.sort - b.sort)
    .map(o => o.v);

  console.log('Correct power order:', state.correctPowerOrder);

  // Periodic table clue will be applied later (BLOCK 5)
}

/* ============================================================
   BLOCK 2 — INIT GAME
   ============================================================ */

function initGame() {
  if (state.gameStarted) return;
  state.gameStarted = true;

  randomizePowerOrder();
  updateContaminationVisual();
  updateConsoleStatus();

  showOverlay('Lab systems booting... Power relay, mixer, DNA machine, and vents are all offline.', 3500);
}

/* ============================================================
   BLOCK 2 — POWER RELAY INTERACTION
   ============================================================ */

function handleSwitchPress(switchId) {
  if (state.powerRestored) {
    showOverlay('Power already restored. Relay is locked.');
    return;
  }

  state.currentPowerSequence.push(switchId);

  // Visual feedback
  const el = document.getElementById('switch' + switchId);
  if (el) {
    el.setAttribute('material', 'color:#aaa');
    setTimeout(() => {
      el.setAttribute('material', 'color:#666');
    }, 200);
  }

  if (state.currentPowerSequence.length === 3) {
    const seq = state.currentPowerSequence.join(',');
    const correct = state.correctPowerOrder.join(',');

    if (seq === correct) {
      state.powerRestored = true;
      showOverlay('Power restored. Systems coming online.');
      updateConsoleStatus();
    } else {
      state.contaminationLevel++;
      updateContaminationVisual();
      showOverlay('Incorrect relay sequence. Contamination spike.', 3000);
    }

    // Reset sequence
    state.currentPowerSequence = [];
  }
}

/* ============================================================
   BLOCK 2 — MOUSE / CLICK HANDLING
   ============================================================ */

document.addEventListener('DOMContentLoaded', () => {
  initGame();

  // Simple raycast-like click handling using cursor
  const sceneEl = document.querySelector('a-scene');

  sceneEl.addEventListener('click', (evt) => {
    const target = evt.target;
    if (!target || !target.id) return;

    // Power switches
    if (target.id === 'switch1') {
      handleSwitchPress('1');
    } else if (target.id === 'switch2') {
      handleSwitchPress('2');
    } else if (target.id === 'switch3') {
      handleSwitchPress('3');
    }

    // Mixer and bottles will be wired later (BLOCK 4)
    // DNA machine and vents will be wired later (BLOCK 4/6)
  });
});
</script>
<!-- ============================================================
     BLOCK 3 — MIXER LOGIC + PERIODIC TABLE CLUE + PUZZLES
     ============================================================ -->

<script>
/* ============================================================
   BLOCK 3 — PERIODIC TABLE CLUE (TOP ROW, GREEN)
   ============================================================ */

function applyPeriodicTableClue() {
  // We use the first three cells in the top row to show the order.
  // Order mapping:
  // '1' -> pt-cell-1
  // '2' -> pt-cell-2
  // '3' -> pt-cell-3
  //
  // The sequence of glowing cells matches the random switch order.

  // Reset all cells to neutral
  for (let i = 1; i <= 10; i++) {
    const cell = document.getElementById('pt-cell-' + i);
    if (cell) {
      cell.setAttribute('material', 'color:#444');
      cell.setAttribute('scale', '1 1 1');
    }
  }

  const order = state.correctPowerOrder; // e.g. ['2','3','1']

  order.forEach((num, index) => {
    const cellIndex = parseInt(num, 10); // 1, 2, or 3
    const cell = document.getElementById('pt-cell-' + cellIndex);
    if (!cell) return;

    // Slight scale based on position in sequence
    const scaleFactor = 1 + index * 0.1;

    cell.setAttribute('material', 'color:#3ddc8a; opacity:0.9; shader:flat');
    cell.setAttribute('scale', `${scaleFactor} ${scaleFactor} 1`);
  });

  showOverlay('Periodic table highlight: top row squares show the relay order.', 3500);
}

/* ============================================================
   BLOCK 3 — MIXER LOGIC
   ============================================================ */

const mixerState = {
  selectedBottles: [],
  correctCombo: ['A', 'C'], // example: A + C is correct
};

function handleBottleClick(bottleId) {
  if (!state.powerRestored) {
    showOverlay('Mixer requires power. Restore relay first.');
    return;
  }

  if (state.mixerCorrect) {
    showOverlay('Mixer already stabilized.');
    return;
  }

  state.mixerActive = true;

  // Toggle bottle selection
  const idx = mixerState.selectedBottles.indexOf(bottleId);
  if (idx >= 0) {
    mixerState.selectedBottles.splice(idx, 1);
  } else {
    mixerState.selectedBottles.push(bottleId);
  }

  // Visual feedback
  const bottleEl = document.getElementById('bottle' + bottleId);
  if (bottleEl) {
    if (idx >= 0) {
      bottleEl.setAttribute('material', 'color:#777');
    } else {
      if (bottleId === 'A') bottleEl.setAttribute('material', 'color:#d55');
      if (bottleId === 'B') bottleEl.setAttribute('material', 'color:#5d5');
      if (bottleId === 'C') bottleEl.setAttribute('material', 'color:#55d');
    }
  }

  updateConsoleStatus();
}

function handleMixerActivate() {
  if (!state.powerRestored) {
    showOverlay('Mixer cannot start without power.');
    return;
  }

  if (state.mixerCorrect) {
    showOverlay('Mixer already stabilized.');
    return;
  }

  if (!state.mixerActive) {
    showOverlay('Select at least one bottle before starting the mixer.');
    return;
  }

  const selected = mixerState.selectedBottles.slice().sort().join(',');
  const correct = mixerState.correctCombo.slice().sort().join(',');

  if (selected === correct) {
    state.mixerCorrect = true;
    showOverlay('Mixer stabilized. Chemical profile is safe.', 3000);
  } else {
    state.contaminationLevel++;
    showOverlay('Mixer output unstable. Contamination increased.', 3000);
  }

  updateContaminationVisual();
  updateConsoleStatus();
}

/* ============================================================
   BLOCK 3 — DNA MACHINE LOGIC (SIMPLE GATE)
   ============================================================ */

function handleDnaMachineUse() {
  if (!state.powerRestored) {
    showOverlay('DNA machine requires power.');
    return;
  }

  if (!state.mixerCorrect) {
    showOverlay('DNA machine requires stable mixer output.');
    return;
  }

  if (state.dnaUnlocked) {
    showOverlay('DNA machine already unlocked.');
    return;
  }

  state.dnaUnlocked = true;
  showOverlay('DNA machine unlocked. Sequence stabilized.', 3000);
  updateConsoleStatus();
}

/* ============================================================
   BLOCK 3 — VENT PANEL LOGIC (FINAL GATE)
   ============================================================ */

function handleVentPanelUse() {
  if (!state.powerRestored) {
    showOverlay('Vents require power.');
    return;
  }

  if (!state.mixerCorrect || !state.dnaUnlocked) {
    showOverlay('Vents cannot open until mixer and DNA machine are stable.');
    return;
  }

  if (state.ventsUnlocked) {
    showOverlay('Vents already open.');
    return;
  }

  state.ventsUnlocked = true;
  showOverlay('Vents opened. Contamination venting...', 3500);
  updateConsoleStatus();
}

/* ============================================================
   BLOCK 3 — EXTEND CLICK HANDLING FOR ALL PUZZLES
   ============================================================ */

document.addEventListener('DOMContentLoaded', () => {
  // We already called initGame and basic click handling in Block 2.
  // Here we extend the click logic for bottles, mixer, DNA, vents,
  // and apply the periodic table clue once the order is known.

  applyPeriodicTableClue();

  const sceneEl = document.querySelector('a-scene');

  sceneEl.addEventListener('click', (evt) => {
    const target = evt.target;
    if (!target || !target.id) return;

    // Bottles
    if (target.id === 'bottleA') {
      handleBottleClick('A');
    } else if (target.id === 'bottleB') {
      handleBottleClick('B');
    } else if (target.id === 'bottleC') {
      handleBottleClick('C');
    }

    // Mixer
    if (target.id === 'mixer') {
      handleMixerActivate();
    }

    // DNA machine
    if (target.id === 'dnaMachine' || target.parentElement?.id === 'dnaMachine') {
      handleDnaMachineUse();
    }

    // Vent panel
    if (target.id === 'ventPanel' || target.parentElement?.id === 'ventPanel') {
      handleVentPanelUse();
    }
  });
});
</script>
</body>
</html>
