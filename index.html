<!doctype html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <!-- Player camera with WASD movement + mouse look -->
    <a-entity 
      id="player"
      camera
      wasd-controls
      look-controls
      position="0 1.6 0">
    </a-entity>

    <a-box position="-1 1 -3" color="red"></a-box>
    <a-sphere position="1 1 -4" color="blue"></a-sphere>

    <!-- MUCH larger grass floor -->
    <a-plane
      position="0 0 -20"
      rotation="-90 0 0"
      width="200"
      height="200"
      color="#4CAF50">
    </a-plane>

    <!-- Blue sky -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Sun -->
    <a-sphere
      position="0 20 -50"
      radius="5"
      color="white"
      material="shader: flat">
    </a-sphere>

  </a-scene>

</body>

</html>
